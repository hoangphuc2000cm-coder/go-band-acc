<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unban Tool - Hoàng Phúc</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#1e3c72,#2a5298,#6a11cb);display:flex;justify-content:center;align-items:center;padding:20px}
.container{background:#fff;border-radius:16px;padding:30px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.header h1{font-size:22px;color:#1e3c72}
.badge-name{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;font-size:11px;padding:5px 12px;border-radius:20px;font-weight:bold;box-shadow:0 4px 12px rgba(106,17,203,.3)}
.warning{background:#e3f2fd;border-left:4px solid #2196f3;padding:12px;border-radius:8px;font-size:13px;color:#1565c0;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#333}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none;transition:.3s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#6a11cb;box-shadow:0 0 0 3px rgba(106,17,203,.1)}
#keyInput{text-align:center;font-size:18px;letter-spacing:3px;font-weight:bold;text-transform:uppercase}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:.3s}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(106,17,203,.4)}
.result{margin-top:20px;padding:16px;border-radius:10px;font-size:14px}
.result.success{background:#d4edda;border-left:4px solid #28a745;color:#155724}
.result.error{background:#f8d7da;border-left:4px solid #dc3545;color:#721c24}
.result.loading{background:#d1ecf1;border-left:4px solid #17a2b8;color:#0c5460}
.progress-bar{height:8px;background:#e0e0e0;border-radius:4px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6a11cb,#2575fc);width:0%;transition:width .3s}
.hidden{display:none}
.user-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-radius:10px;margin-bottom:16px;font-size:13px;color:#2e7d32;flex-wrap:wrap;gap:8px}
.user-bar code{background:#fff;padding:2px 6px;border-radius:4px;color:#6a11cb;font-weight:bold;font-size:11px}
.btn-logout{background:#ff4757;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-logout:hover{background:#e63946}
.account-info{background:#f8f9fa;border:2px solid #e0e0e0;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.account-header{font-weight:bold;color:#1e3c72;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed #ccc;font-size:14px}
.account-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:#333}
.account-row span{color:#666}
.account-row b{color:#1e3c72}
.status-banned{color:#dc3545!important}
.btn-back{width:100%;margin-top:12px;padding:12px;background:#fff;color:#6a11cb;border:2px solid #6a11cb;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
.btn-back:hover{background:#6a11cb;color:#fff}
.footer{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid #eee;font-size:12px;color:#888}
.footer b{color:#6a11cb}
.footer .phone{display:inline-block;background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;padding:4px 12px;border-radius:20px;font-weight:bold;font-size:12px;margin-top:6px;text-decoration:none}
.contact-box{background:linear-gradient(135deg,#fff3cd,#ffeaa7);border-left:4px solid #ffc107;padding:12px;border-radius:8px;font-size:13px;color:#856404;margin-top:12px;text-align:center}
.contact-box b{color:#dc3545;font-size:15px}
.price-box{background:linear-gradient(135deg,#fff9e6,#ffeaa7);border:2px solid #ffc107;border-radius:12px;padding:14px;margin-top:16px}
.price-title{text-align:center;font-weight:bold;color:#856404;font-size:14px;margin-bottom:12px}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#fff;border-radius:8px;margin-bottom:8px;font-size:14px}
.price-row:last-child{margin-bottom:0}
.price-row .label{color:#333;font-weight:600}
.price-row .value{color:#dc3545;font-weight:bold;font-size:16px}
.price-row .hot{background:#ff4757;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ========== 50 KEY RANDOM ==========
const KEY_POOL = {
  'HP-7K2A-9M3X':{duration:1800000,label:'User'},'HP-4B8N-2P1Q':{duration:1800000,label:'User'},
  'HP-6T5R-8W4E':{duration:1800000,label:'User'},'HP-3Y9U-7I2O':{duration:1800000,label:'User'},
  'HP-1A4S-6D8F':{duration:1800000,label:'User'},'HP-5G7H-3J9K':{duration:1800000,label:'User'},
  'HP-2L4Z-8X6C':{duration:1800000,label:'User'},'HP-9V1B-5N7M':{duration:1800000,label:'User'},
  'HP-3Q8W-2E4R':{duration:1800000,label:'User'},'HP-6T1Y-9U3I':{duration:1800000,label:'User'},
  'HP-4O7P-1A5S':{duration:1800000,label:'User'},'HP-8D2F-6G4H':{duration:1800000,label:'User'},
  'HP-3J9K-7L1Z':{duration:1800000,label:'User'},'HP-5X8C-2V4B':{duration:1800000,label:'User'},
  'HP-9N7M-3Q1W':{duration:1800000,label:'User'},'HP-2E4R-8T6Y':{duration:1800000,label:'User'},
  'HP-5U3I-1O7P':{duration:1800000,label:'User'},'HP-9A5S-4D2F':{duration:1800000,label:'User'},
  'HP-6G4H-8J3K':{duration:1800000,label:'User'},'HP-2L1Z-9X7C':{duration:1800000,label:'User'},
  'HP-5V4B-3N2M':{duration:1800000,label:'User'},'HP-8Q1W-6E9R':{duration:1800000,label:'User'},
  'HP-4T7Y-2U5I':{duration:1800000,label:'User'},'HP-1O3P-7A9S':{duration:1800000,label:'User'},
  'HP-6D8F-4G2H':{duration:1800000,label:'User'},'HP-3J5K-1L7Z':{duration:1800000,label:'User'},
  'HP-9X2C-8V4B':{duration:1800000,label:'User'},'HP-7N3M-5Q1W':{duration:1800000,label:'User'},
  'HP-2E4R-6T8Y':{duration:1800000,label:'User'},'HP-8U3I-4O2P':{duration:1800000,label:'User'},
  'HP-1A5S-9D7F':{duration:1800000,label:'User'},'HP-6G4H-2J8K':{duration:1800000,label:'User'},
  'HP-3L1Z-5X9C':{duration:1800000,label:'User'},'HP-7V4B-1N3M':{duration:1800000,label:'User'},
  'HP-5Q8W-9E2R':{duration:1800000,label:'User'},'HP-4T6Y-8U1I':{duration:1800000,label:'User'},
  'HP-2O3P-6A5S':{duration:1800000,label:'User'},'HP-8D1F-4G7H':{duration:1800000,label:'User'},
  'HP-5J9K-3L2Z':{duration:1800000,label:'User'},'HP-9X6C-7V1B':{duration:1800000,label:'User'},
  'HP-3N5M-8Q4W':{duration:1800000,label:'User'},'HP-6E2R-1T9Y':{duration:1800000,label:'User'},
  'HP-7U8I-5O3P':{duration:1800000,label:'User'},'HP-4A1S-9D6F':{duration:1800000,label:'User'},
  'HP-2G7H-5J4K':{duration:1800000,label:'User'},'HP-9L3Z-1X8C':{duration:1800000,label:'User'},
  'HP-6V5B-3N7M':{duration:1800000,label:'User'},'HP-8Q2W-4E1R':{duration:1800000,label:'User'},
  'HP-5T9Y-6U3I':{duration:1800000,label:'User'},'HP-7O1P-2A8S':{duration:1800000,label:'User'}
};

const LS_USED='unban_used_keys', LS_SESSION='unban_session', LS_ACCOUNT='unban_account';
const getUsedKeys=()=>{const r=localStorage.getItem(LS_USED);return r?JSON.parse(r):{}};
const markKeyUsed=(k,i)=>{const u=getUsedKeys();u[k]={usedAt:Date.now(),label:i.label};localStorage.setItem(LS_USED,JSON.stringify(u))};
const isKeyUsed=k=>!!getUsedKeys()[k];
const saveSession=(k,i)=>localStorage.setItem(LS_SESSION,JSON.stringify({key:k,label:i.label,startAt:Date.now(),expireAt:Date.now()+i.duration}));
const getSession=()=>{const r=localStorage.getItem(LS_SESSION);if(!r)return null;try{const s=JSON.parse(r);if(Date.now()>s.expireAt){localStorage.removeItem(LS_SESSION);return null}return s}catch{return null}};
const saveAccount=d=>localStorage.setItem(LS_ACCOUNT,JSON.stringify({...d,savedAt:Date.now()}));
const getAccount=()=>{const r=localStorage.getItem(LS_ACCOUNT);return r?JSON.parse(r):null};
const clearAccount=()=>localStorage.removeItem(LS_ACCOUNT);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let currentPage='key';

function render(){
  const app=document.getElementById('app');
  if(currentPage==='key') renderKey(app);
  else if(currentPage==='lookup') renderLookup(app);
  else if(currentPage==='unban') renderUnban(app);
}

function renderKey(app){
  app.className='container';
  app.innerHTML=`
    <div class="header"><h1>🔐 Xác Thực Key</h1><span class="badge-name">By Hoàng Phúc</span></div>
    <div class="warning">💡 Mỗi key chỉ sử dụng được <b>1 lần duy nhất</b>.</div>
    <form id="keyForm">
      <div class="form-group"><label>🔑 Nhập Key</label>
      <input type="text" id="keyInput" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required></div>
      <button type="submit" class="btn-submit">🚀 Xác Nhận Key</button>
    </form>
    <div id="keyResult" class="result hidden"></div>
    <div class="price-box">
      <div class="price-title">💰 BẢNG GIÁ KEY 💰</div>
      <div class="price-row">
        <span class="label">📅 Key 1 Ngày</span>
        <span class="value">20.000đ</span>
      </div>
      <div class="price-row">
        <span class="label">📆 Key 1 Tuần<span class="hot">HOT</span></span>
        <span class="value">50.000đ</span>
      </div>
    </div>
    <div class="footer">
      Made by <b>Hoàng Phúc</b><br>
      <a href="tel:0916678949" class="phone">📞 0916 678 949</a>
    </div>`;
  document.getElementById('keyForm').addEventListener('submit',e=>{
    e.preventDefault();
    const k=document.getElementById('keyInput').value.trim().toUpperCase();
    const res=document.getElementById('keyResult');
    res.className='result loading';res.classList.remove('hidden');res.textContent='⏳ Đang xác thực...';
    setTimeout(()=>{
      const info=KEY_POOL[k];
      if(!info){res.className='result error';res.innerHTML='❌ <b>Key không hợp lệ!</b><br><br>Liên hệ <b>0916 678 949</b> để nhận key.';return}
      if(isKeyUsed(k)){const t=new Date(getUsedKeys()[k].usedAt).toLocaleString('vi-VN');
        res.className='result error';res.innerHTML=`🚫 <b>Key đã được sử dụng!</b><br><br>📅 ${t}<br><i>Mỗi key chỉ dùng 1 lần.</i><br><br>Liên hệ <b>0916 678 949</b> để mua key mới.`;return}
      markKeyUsed(k,info);saveSession(k,info);
      res.className='result success';res.innerHTML='✅ <b>Thành công!</b><br>Chuyển tới nhập ID...';
      setTimeout(()=>{currentPage='lookup';render()},900);
    },800);
  });
}

function renderLookup(app){
  const s=getSession();
  if(!s){alert('⛔ Cần nhập key!');currentPage='key';render();return}
  app.className='container';
  app.innerHTML=`
    <div class="header"><h1>🆔 Nhập ID Tài Khoản</h1><span class="badge-name">By Hoàng Phúc</span></div>
    <div class="user-bar"><span>👋 ${s.label} | 🔑 <code>${s.key}</code></span>
      <button id="logoutBtn" class="btn-logout">🚪 Thoát</button></div>
    <div class="warning">✅ Key hợp lệ! Nhập ID tài khoản cần gỡ band.</div>
    <form id="lookupForm">
      <div class="form-group"><label>🎮 Chọn Game</label>
        <select id="game" required><option value="">-- Chọn --</option>
        <option value="freefire">Free Fire</option><option value="pubg">PUBG Mobile</option>
        <option value="lienquan">Liên Quân</option><option value="lol">LMHT</option>
        <option value="genshin">Genshin Impact</option></select></div>
      <div class="form-group"><label>🆔 UID Tài Khoản</label>
        <input type="text" id="uid" placeholder="Nhập UID (≥5 ký tự)" required></div>
      <div class="form-group"><label>👤 Tên Nhân Vật</label>
        <input type="text" id="nickname" placeholder="Tên trong game" required></div>
      <button type="submit" class="btn-submit">🔍 Kiểm Tra</button>
    </form>
    <div id="lookupResult" class="result hidden"></div>
    <div class="footer">
      Made by <b>Hoàng Phúc</b><br>
      <a href="tel:0916678949" class="phone">📞 0916 678 949</a>
    </div>`;
  document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem(LS_SESSION);localStorage.removeItem(LS_ACCOUNT);currentPage='key';render()});
  document.getElementById('lookupForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const data={game:document.getElementById('game').value,uid:document.getElementById('uid').value.trim(),nickname:document.getElementById('nickname').value.trim()};
    const res=document.getElementById('lookupResult');
    res.className='result loading';res.classList.remove('hidden');
    res.innerHTML=`🔍 Đang kiểm tra...<div class="progress-bar"><div class="progress-fill" id="fill"></div></div><div id="status" style="margin-top:8px;font-size:13px;"></div>`;
    const steps=[{t:'📡 Kết nối...',d:700},{t:'🔎 Tra cứu UID...',d:900},{t:'📋 Kiểm tra band...',d:800}];
    const fill=document.getElementById('fill'),status=document.getElementById('status');
    for(let i=0;i<steps.length;i++){await sleep(steps[i].d);status.textContent=steps[i].t;fill.style.width=`${((i+1)/steps.length)*100}%`}
    await sleep(600);
    if(data.uid.length<5){res.className='result error';res.innerHTML=`❌ <b>Không tìm thấy tài khoản!</b><br>UID <code>${data.uid}</code> không tồn tại.`;return}
    saveAccount(data);
    res.className='result success';
    res.innerHTML=`✅ <b>Tìm thấy tài khoản!</b><br><br>🎮 ${data.game.toUpperCase()}<br>🆔 ${data.uid}<br>👤 ${data.nickname}<br>🚫 <b style="color:#dc3545">BANNED</b><br><br><i>Chuyển tới gỡ band...</i>`;
    setTimeout(()=>{currentPage='unban';render()},1200);
  });
}

function renderUnban(app){
  const s=getSession();
  if(!s){alert('⛔ Cần nhập key!');currentPage='key';render();return}
  const acc=getAccount();
  if(!acc){alert('⛔ Cần nhập ID!');currentPage='lookup';render();return}
  app.className='container';
  app.innerHTML=`
    <div class="header"><h1>🔓 Gỡ Band</h1><span class="badge-name">By Hoàng Phúc</span></div>
    <div class="user-bar"><span>👋 ${s.label}</span>
      <button id="logoutBtn" class="btn-logout">🚪 Thoát</button></div>
    <div class="account-info">
      <div class="account-header">📋 Thông Tin Tài Khoản</div>
      <div class="account-row"><span>🎮 Game:</span><b>${acc.game.toUpperCase()}</b></div>
      <div class="account-row"><span>🆔 UID:</span><b>${acc.uid}</b></div>
      <div class="account-row"><span>👤 Nick:</span><b>${acc.nickname}</b></div>
      <div class="account-row"><span>🚫 Trạng thái:</span><b class="status-banned">BANNED</b></div>
    </div>
    <form id="unbanForm">
      <div class="form-group"><label>📧 Email</label>
        <input type="email" id="email" placeholder="email@example.com" required></div>
      <div class="form-group"><label>📝 Lý Do Gỡ Band</label>
        <textarea id="reason" rows="3" placeholder="Tôi bị band nhầm..." required></textarea></div>
      <button type="submit" class="btn-submit">🚀 Gửi Yêu Cầu</button>
    </form>
    <div id="result" class="result hidden"></div>
    <button id="backBtn" class="btn-back">◀️ Đổi tài khoản khác</button>
    <div class="footer">
      Made by <b>Hoàng Phúc</b><br>
      <a href="tel:0916678949" class="phone">📞 0916 678 949</a>
    </div>`;
  document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem(LS_SESSION);localStorage.removeItem(LS_ACCOUNT);currentPage='key';render()});
  document.getElementById('backBtn').addEventListener('click',()=>{clearAccount();currentPage='lookup';render()});
  document.getElementById('unbanForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const data={...acc,email:document.getElementById('email').value,reason:document.getElementById('reason').value,time:new Date().toLocaleString('vi-VN')};
    const res=document.getElementById('result');
    res.className='result loading';res.classList.remove('hidden');
    res.innerHTML=`⏳ Đang xử lý...<div class="progress-bar"><div class="progress-fill" id="fill"></div></div><div id="status" style="margin-top:8px;font-size:13px;"></div>`;
    const steps=[{t:'🔍 Xác thực UID...',d:800},{t:'📡 Gửi tới NPH...',d:900},{t:'📤 Xử lý hồ sơ...',d:1000},{t:'⏳ Chờ phản hồi...',d:1000}];
    const fill=document.getElementById('fill'),status=document.getElementById('status');
    for(let i=0;i<steps.length;i++){await sleep(steps[i].d);status.textContent=steps[i].t;fill.style.width=`${((i+1)/steps.length)*100}%`}
    await sleep(700);
    const ok=Math.random()>0.3;
    if(ok){const tid='UB'+Math.random().toString(36).substring(2,10).toUpperCase();
      res.className='result success';
      res.innerHTML=`✅ <b>Yêu cầu đã ghi nhận!</b><br><br>🎫 Ticket: <b>${tid}</b><br>🎮 ${data.game.toUpperCase()}<br>🆔 ${data.uid}<br>👤 ${data.nickname}<br>📧 ${data.email}<br>📅 ${data.time}<br><br><i>⏰ Chờ 24-72h để xử lý.</i><div class="contact-box">📞 Cần hỗ trợ gấp?<br>Liên hệ <b>0916 678 949</b></div>`;
    }else{res.className='result error';
      res.innerHTML=`❌ <b>Yêu cầu bị từ chối!</b><br><br>Lý do: Tài khoản vi phạm nghiêm trọng.<div class="contact-box">📞 Cần hỗ trợ?<br>Liên hệ <b>0916 678 949</b></div>`}
  });
}

setInterval(()=>{
  if(currentPage!=='key'){
    const s=getSession();
    if(!s){alert('⏰ Hết hạn key!');currentPage='key';render()}
  }
},1000);

render();
</script>
</body>
</html>
